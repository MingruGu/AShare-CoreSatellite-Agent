# ==========================================================
# AShare-CoreSatellite-Agent 配置文件模板
# 使用前请复制本文件并重命名为 config.yaml
# ==========================================================

storage:
  cache_dir: "./data_cache"
  ledger_path: "./data_cache/portfolio_ledger.json"

strategy:
  start_date: "20220101"
  target_volatility: 0.095      # 组合目标年化波动率 (9.5%)
  rf_annual_rate: 0.022         # 闲置现金无风险年化收益率 (2.2% 货币基金基准)
  fee_rate: 0.0008              # 单边综合摩擦成本 (万三佣金 + 千一印花税折算)
  max_offense_positions: 5      # 多头活跃期最大进攻持仓数量
  max_defense_ratio: 0.35       # 防御红利压舱石最高仓位比例
  atr_stop_multiplier: 2.2      # 初始宽幅硬止损倍数 (-2.2 * ATR)
  trailing_trigger_pct: 0.075   # 激活移动追踪止盈的浮盈门槛 (+7.5%)
  trailing_atr_multiplier: 1.3  # 移动止盈回撤保护线倍数 (1.3 * ATR)
  hard_take_profit_pct: 0.24    # 单笔波段目标止盈上限 (+24.0%)

universe:
  # 动态全市场交易龙头海选门槛
  min_daily_amount: 800000000   # 最低日成交额门槛 (8亿元，过滤微盘杂毛)
  min_mom_60d: 10.0             # 最低60日累计涨幅 (10%，过滤阴跌白马)
  min_daily_chg: -4.5           # 当日涨跌幅下限 (%)
  max_daily_chg: 1.5            # 当日涨跌幅上限 (%，只买回调低吸，拒绝追高)

  # 核心防御压舱石池（低波高股息红利龙头）
  defense_pool:
    "600900": "长江电力"
    "601088": "中国神华"
    "600036": "招商银行"
    "601398": "工商银行"
    "600938": "中国海油"
    "601857": "中国石油"

  # 历史回测默认代表性主线股票池
  backtest_offense_pool:
    "603986": "兆易创新"
    "688981": "中芯国际"
    "002371": "北方华创"
    "688041": "海光信息"
    "002050": "三花智控"
    "601689": "拓普集团"
    "688017": "绿的谐波"
    "002747": "埃斯顿"
    "300308": "中际旭创"
    "002475": "立讯精密"
    "300750": "宁德时代"
    "002594": "比亚迪"
    "601899": "紫金矿业"
    "603993": "洛阳钼业"
    "600547": "山东黄金"
    "600276": "恒瑞医药"
    "300760": "迈瑞医疗"
    "600760": "中航沈飞"

notification:
  # 前往 https://sct.ftqq.com 微信扫码获取 SendKey 填入此处即可开启自动提醒
  serverchan_sendkey: ""
